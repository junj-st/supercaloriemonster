[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# B008: FastAPI's `Depends(...)` in argument defaults is the intended idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# conftest must set DB_PATH before importing the app.
"tests/conftest.py" = ["E402"]
