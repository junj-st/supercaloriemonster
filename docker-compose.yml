services:
  scm:
    build: .
    ports:
      # Loopback only: the app has no authentication. To reach it from other
      # devices, put a reverse proxy with auth in front (see README) rather than
      # changing this to 0.0.0.0.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - USDA_API_KEY=${USDA_API_KEY:-}
    restart: unless-stopped
