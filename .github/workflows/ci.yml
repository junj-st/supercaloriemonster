name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t scm:ci .
      - name: Smoke test container
        run: |
          docker run -d --name scm -p 8000:8000 scm:ci
          for i in $(seq 1 20); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          docker logs scm; exit 1
